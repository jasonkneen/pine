apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = "dev.pmndre.pine"
    compileSdk = rootProject.ext.compileSdkVersion
    ndkVersion = rootProject.ext.ndkVersion
    defaultConfig {
        applicationId "dev.pmndre.pine"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // The release job passes the release's version and its code (scripts/version-code.ts).
        versionCode Integer.parseInt(System.getenv("PINE_VERSION_CODE") ?: "1")
        versionName System.getenv("PINE_VERSION") ?: "0.0.0-dev"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // The release key, only when the release job (or a developer) names it in the environment:
    // without it a release build is left unsigned. The keystore never lies in the repository.
    def keystore = System.getenv("ANDROID_KEYSTORE_FILE")
    if (keystore) {
        signingConfigs {
            release {
                storeFile file(keystore)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            if (keystore) signingConfig signingConfigs.release
            // Phones are arm: the release packs libwebrtc for those two ABIs alone (x86 and x86_64,
            // for emulators, stay in debug builds).
            ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// The authority a debug build trusts besides the system's, for the smoke run alone: its meeting
// service is https on this computer, with a certificate of the run's own (scripts/smoke.mjs passes
// -PpineSmokeAuthority=<its CA, PEM>). Written as the raw resource that src/debug's network security
// config names under debug-overrides, which Android applies to a debuggable app only; a release
// build has neither. Without the property it is smoke-authority-nobody.pem, an authority whose
// private key was thrown away when it was made: a debug build then trusts the system's alone.
abstract class SmokeAuthority extends DefaultTask {
    @InputFile abstract RegularFileProperty getAuthority()
    @OutputDirectory abstract DirectoryProperty getOutputDir()

    @TaskAction
    void write() {
        def raw = outputDir.get().dir("raw").asFile
        raw.mkdirs()
        new File(raw, "smoke_authority.pem").bytes = authority.get().asFile.bytes
    }
}

def smokeAuthority = tasks.register("smokeAuthority", SmokeAuthority) {
    authority = file(project.findProperty("pineSmokeAuthority") ?: "smoke-authority-nobody.pem")
}

androidComponents {
    onVariants(selector().withBuildType("debug")) { variant ->
        variant.sources.res.addGeneratedSourceDirectory(smokeAuthority, SmokeAuthority::getOutputDir)
    }
}

kotlin {
    compilerOptions {
        // As Capacitor's Java (capacitor.build.gradle): 21.
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // The plugin's core, from ../core (settings.gradle includes that build).
    implementation 'pine.mobile:pine-mobile-core'
    // The full BouncyCastle the core's SSH needs, put in place of Android's cut-down one (PinePlugin.load).
    implementation 'org.bouncycastle:bcprov-jdk18on:1.84'
    // The WebRTC library under a paired computer's data channel (LibWebRtc.kt, handed to the core):
    // Google's libwebrtc as LiveKit builds it without video codecs (BSD-3-Clause), its classes under
    // livekit.org.webrtc. Published stripped, its 64-bit natives aligned for 16 KB pages; its
    // manifest asks for no permission. It depends on nothing else.
    implementation 'io.github.webrtc-sdk:android-prefixed-stripped:150.7871.08'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    // The emulator check of LibWebRtc.kt asks the run's meeting service first, as the core does (../core).
    androidTestImplementation 'com.squareup.okhttp3:okhttp:5.3.2'
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
